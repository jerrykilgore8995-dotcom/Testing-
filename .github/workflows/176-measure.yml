name: 176 preliminary SPICE measurement
on:
  push:
    paths:
      - '176/**'
      - '.github/workflows/176-measure.yml'
  workflow_dispatch:
jobs:
  measure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y ngspice python3-numpy
      - run: /usr/bin/python3 176/measure.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: 176-preliminary-measurements
          path: |
            176/*.csv
            176/*.log
